<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" title="texto/css" href="Contacto.css" />   
    <title>Contacto</title>
</head>
<body>
     <header>
      <img src="barzola_logo.svg"
        alt="Logo de Barzola"
        height="300px
        width="auto"
      />
      <nav>
        
        <a class="btn btn-primary" style="background-color:#7a1330; border-color:#7a1330;" href="./inicio.html">Inicio</a>
        <a class="btn btn-primary" style="background-color:#7a1330; border-color:#7a1330;" href="./Productos.html">Productos</a>
        <a class="btn btn-primary" style="background-color:#7a1330; border-color:#7a1330;" href="./Promociones.html">Promociones</a>
        <a class="btn btn-primary" style="background-color:#7a1330; border-color:#7a1330;" href="./Contacto.html">Contacto</a>
      </nav>
      <br>

    </header>
    <section class="container my-5">
        <h1>Contacto</h1>

        <p>¿Tenés alguna consulta? Escribinos.</p>

        <form>
          <!-- NOMBRE -->

          <div class="mb-3">
            <label for="nombre" class="form-label"> Nombre </label>

            <input
              type="text"
              class="form-control"
              id="nombre"
              placeholder="Ingresá tu nombre"
            />
          </div>

          <!-- EMAIL -->

          <div class="mb-3">
            <label for="email" class="form-label"> Email </label>

            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="nombre@email.com"
            />
          </div>

          <!-- TELEFONO -->

          <div class="mb-3">
            <label for="telefono" class="form-label"> Teléfono </label>

            <input
              type="tel"
              class="form-control"
              id="telefono"
              placeholder="11 1234-5678"
            />
          </div>

          <!-- ASUNTO -->

          <div class="mb-3">
            <label for="asunto" class="form-label"> Asunto </label>

            <input type="text" class="form-control" id="asunto" />
          </div>

          <!-- MENSAJE -->

          <div class="mb-3">
            <label for="mensaje" class="form-label"> Mensaje </label>

            <textarea class="form-control" id="mensaje" rows="5"></textarea>
          </div>

          <!-- BOTON -->

                 <a class="btn btn-primary" style="background-color:#7a1330; border-color:#7a1330;" href="">Enviar</a>    
        </form>
      </section>
    <footer> 
       <h3>Leonardo Barzola</h3>
      <h5>TIENDA ONLINE ARGENTINA</h5>
      <div> 
        <a class="btn btn-primary" style="background-color: #7a1330; border-color:#7a1330;" href="https://www.facebook.com/vinos.barzola/photos?_rdc=2&_rdr#">Facebook</a>
        <a class="btn btn-primary" style="background-color: #7a1330; border-color:#7a1330;" href="https://www.instagram.com/vinosbarzola/">Instagram</a>
      </div>
      <p><strong> ENVIOS A TODO EL PAIS</strong></p>
    </footer>
  
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

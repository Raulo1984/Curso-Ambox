<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,600&amp;display=swap');

      .bg { fill: #ffffff; }
      .brand {
        font-family: 'Cormorant Garamond', serif;
        font-weight: 700;
        letter-spacing: 14px;
        fill: #7a1330;
      }
      .script {
        font-family: 'Cormorant Garamond', serif;
        font-style: italic;
        font-weight: 600;
        letter-spacing: 4px;
        fill: #a97a1f;
      }
      .rule { stroke: #a97a1f; stroke-width: 1.4; }
      .dot { fill: #a97a1f; }
    </style>

    <linearGradient id="goldWine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8c877"/>
      <stop offset="45%" stop-color="#c79a3f"/>
      <stop offset="55%" stop-color="#8a1f2e"/>
      <stop offset="100%" stop-color="#5c1220"/>
    </linearGradient>

    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b98a3a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e8c877" stop-opacity="1"/>
      <stop offset="100%" stop-color="#b98a3a" stop-opacity="0"/>
    </linearGradient>

    <filter id="scriptShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4a3312" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect class="bg" x="0" y="0" width="1000" height="320"/>

  <!-- brand mark -->
  <text x="500" y="200" text-anchor="middle" class="brand" font-size="104">BARZOLA</text>

  <!-- script overlay "Vinos" -->
  <text x="503" y="92" text-anchor="middle" class="script" font-size="50" filter="url(#scriptShadow)" transform="rotate(-2 503 92)">Vinos</text>

  <!-- flanking rules with center ornament -->
  <line class="rule" x1="120" y1="244" x2="410" y2="244"/>
  <line class="rule" x1="590" y1="244" x2="880" y2="244"/>
  <circle class="dot" cx="500" cy="244" r="3.5"/>
  <line class="rule" x1="470" y1="244" x2="440" y2="244"/>
  <line class="rule" x1="530" y1="244" x2="560" y2="244"/>
</svg>
